; Xteink X3 - Blackjack
;
; Recipe lifted from Josh-writes/microslate-firmware (same device family, same
; ESP32-C3 + PapyriX-derived panel wiring) and pinned to the same platform so
; the espressif32 board defs match what CrossPoint/PapyriX expect.
;
;   pio run -e xteink_x3              build
;   ./tools/flash.sh                  build + write app1 ONLY (see README first)

[env:xteink_x3]
platform  = espressif32 @ 6.12.0
board     = esp32-c3-devkitm-1
framework = arduino

board_build.flash_size   = 16MB
board_build.flash_mode   = dio
board_build.partitions   = partitions.csv
board_upload.flash_size  = 16MB
board_upload.maximum_size = 6553600
; app0 is CrossPoint and is NOT touched by this project. Our image is built as
; a plain app and written to app1 by tools/flash.sh, so no upload port here.
monitor_speed = 115200

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=0
  -std=gnu++17

build_unflags =
  -std=gnu++11
